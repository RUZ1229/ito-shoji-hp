  <script>
/**
 * 伊藤商事 千葉配送地図
 * 現場マスタ + 倉庫 + コースルート検索
 */
(function () {
  "use strict";

  const DATA_URL = "data/map_data.json";
  const GEOJSON_URL = "data/chiba_cities.geojson";
  const IS_WEB_HOST = /github\.io$/i.test(window.location.hostname);

  let map;
  let mapData;
  let shopMarkers = [];
  let warehouseMarkers = {};
  let routeLayers = [];
  let cityLayer;
  let searchCatalog = [];
  let highlightColors = {};
  let suggestionActiveIndex = -1;
  /** @type {Array<{key:string,type:string,label:string,siteId?:string,siteIds?:string[],course?:string,zoneKey?:string,yokomochiId?:string,warehouseId?:string}>} */
  let activeSelections = [];

  const DEFAULT_SHOP_COLOR = "#3b9eff";
  /** 通常青と被らないハイライト専用（青系・シアン系は使わない） */
  const HIGHLIGHT_PALETTE = [
    "#ffd54a", "#ff8c42", "#ff6348", "#e056fd", "#2ed573",
    "#a55eea", "#ffb142", "#ff6b81", "#ffa502", "#f368e0",
    "#5f27cd", "#ff9ff3", "#ee5253", "#e17055", "#fdcb6e",
    "#e84393", "#6c5ce7", "#fab1a0", "#f39c12", "#8e44ad",
    "#27ae60", "#c0392b", "#f1c40f", "#9b59b6", "#e67e22",
    "#e74c3c", "#d35400", "#cd6136", "#ff7675", "#b33939",
  ];
  const YOKOMOCHI_COLOR = "#ff8c42";

  const $ = (sel) => document.querySelector(sel);

  function norm(s) {
    return (s || "").normalize("NFKC").trim().replace(/\s+/g, "");
  }

  function stripCorp(s) {
    return norm(s).replace(/^(株式会社|有限会社|\(株\)|（株）|\(有\)|（有）)/, "");
  }

  function setMarkerVisible(marker, visible) {
    if (!map || !marker) return;
    if (visible) {
      if (!map.hasLayer(marker)) marker.addTo(map);
    } else if (map.hasLayer(marker)) {
      map.removeLayer(marker);
    }
  }

  function showAllShopMarkers() {
    shopMarkers.forEach(({ marker, site }) => {
      marker.setIcon(createShopIcon(site));
      setMarkerVisible(marker, true);
    });
  }

  function getMapCourse(site) {
    return site.map_course || site.course;
  }

  function resolveMapCourse(course) {
    if (!course || !mapData) return course;
    const merges = mapData.course_merges || {};
    for (const [target, cfg] of Object.entries(merges)) {
      if (course === target) return target;
      if ((cfg.source_courses || []).includes(course)) return target;
    }
    return course;
  }

  function mergedSourceCourses() {
    const src = new Set();
    for (const cfg of Object.values(mapData?.course_merges || {})) {
      for (const c of cfg.source_courses || []) src.add(c);
    }
    return src;
  }

  function enrichSearchAliases() {
    mapData.course_aliases = mapData.course_aliases || {};
    Object.assign(mapData.course_aliases, {
      "1H": "柏1H",
      "1I": "柏1I.5P",
      "2S": "柏2S",
      "2T": "柏2T.5O",
      "3V": "柏3V",
      "3X": "柏3X",
      "5O": "柏2T.5O",
      "5P": "柏1I.5P",
      "3V立": "柏3V車立て",
      "3V車": "柏3V車立て",
      "車立": "柏3V車立て",
    });
  }

  function courseSearchMeta(name) {
    const merges = mapData.course_merges || {};
    for (const [target, cfg] of Object.entries(merges)) {
      if (name === target) return cfg.label || "統合コース";
    }
    if (name === "柏3V車立て") return "ヨドハン千葉";
    return "コース";
  }

  function allCourseGroups() {
    const skip = mergedSourceCourses();
    const pick = (list) => list.filter((c) => !skip.has(c));
    return [
      {
        title: "千葉A（柏）",
        courses: pick([
          "柏1H", "柏1I.5P", "柏2S", "柏2T.5O",
          "柏3V", "柏3V車立て", "柏3X",
        ]),
      },
      {
        title: "千葉B",
        courses: [
          "千Aア", "千Aイ", "千Bカ", "千Bキ", "千Cエ", "千Cオ",
          "千Dタ", "千Dチ", "千E1", "千F2", "千G3", "千H4", "千J6",
        ],
      },
      {
        title: "房",
        courses: ["房館1", "房勝2", "房君3", "房木4", "房木5"],
      },
    ];
  }

  function resolveCourse(query) {
    const q = norm(query);
    if (!q || !mapData) return null;

    const aliases = mapData.course_aliases || {};
    if (aliases[q]) return resolveMapCourse(aliases[q]);

    for (const c of mapData.display_courses || []) {
      if (norm(c) === q) return resolveMapCourse(c);
    }

    for (const c of mapData.display_courses || []) {
      const cn = norm(c);
      if (cn.includes(q) || q.includes(cn)) return resolveMapCourse(c);
    }

    if (mapData.course_merges) {
      for (const name of Object.keys(mapData.course_merges)) {
        if (norm(name) === q || norm(name).includes(q)) return name;
      }
    }
    if (mapData.new_courses) {
      for (const name of Object.keys(mapData.new_courses)) {
        if (norm(name) === q || norm(name).includes(q)) return name;
      }
    }
    if (/^2[tT]$/.test(q) || q === "柏2T") return "柏2T.5O";
    if (/^5[oO]$/.test(q) || q === "柏5O") return "柏2T.5O";
    if (/^1[iI]$/.test(q) || q === "柏1I") return "柏1I.5P";
    if (/^5[pP]$/.test(q) || q === "柏5P") return "柏1I.5P";
    if (/^2[sSｓＳ]$/.test(q) || q === "柏2S" || q === "柏２S") return "柏2S";
    if (/^2[tT]\.?5[oO]?$/.test(q) || q.includes("2T5O") || q.includes("2T.5O")) return "柏2T.5O";
    if (/^1[iI]\.?5[pP]?$/.test(q) || q.includes("1I5P") || q.includes("1I.5P")) return "柏1I.5P";
    if (q.includes("車立") || q.includes("ヨドハン")) return "柏3V車立て";
    if (/^[0-9]+[A-Za-z\u3040-\u9fff]$/.test(q)) {
      const guess = "柏" + q.replace(/[ｓS]/, "S");
      if ((mapData.display_courses || []).includes(guess)) return resolveMapCourse(guess);
    }
    if (/^千[A-Za-z\u3040-\u9fff0-9]+$/.test(q) && (mapData.display_courses || []).includes(q)) {
      return q;
    }
    return null;
  }


  function buildHighlightColors() {
    highlightColors = {};
    const courses = mapData.display_courses || Object.keys(mapData.course_colors || {});
    courses.forEach((course, i) => {
      highlightColors[course] = HIGHLIGHT_PALETTE[i % HIGHLIGHT_PALETTE.length];
    });
  }

  function getCourseHighlightColor(course) {
    return highlightColors[course] || HIGHLIGHT_PALETTE[0];
  }

  function getHighlightColor(site, extraClass) {
    if (!extraClass) return null;
    if (extraClass.includes("is-zone-highlight")) return "#ffd54a";
    if (extraClass.includes("is-course-highlight")) {
      return getCourseHighlightColor(getMapCourse(site));
    }
    return null;
  }

  function createShopIcon(site, extraClass) {
    const color = getHighlightColor(site, extraClass) || DEFAULT_SHOP_COLOR;
    const shape = site.marker_shape || "circle";
    const cls = ["marker-shop", extraClass].filter(Boolean).join(" ");
    const shapeCls = `shape-${shape}`;
    const html = `
      <div class="${cls}" data-id="${site.id}">
        <div class="marker-dot ${shapeCls}" style="--mc:${color}"></div>
        <div class="marker-label">${escapeHtml(site.name)}</div>
      </div>`;
    return L.divIcon({
      html,
      className: "marker-wrap",
      iconSize: [0, 0],
      iconAnchor: [0, 0],
    });
  }

  function createWarehouseIcon(wh) {
    const html = `
      <div class="marker-warehouse" data-id="${wh.id}">
        <div class="marker-dot"></div>
        <div class="marker-label">${escapeHtml(wh.name)}</div>
      </div>`;
    return L.divIcon({
      html,
      className: "marker-wrap",
      iconSize: [0, 0],
      iconAnchor: [0, 0],
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatJpDate(iso) {
    if (!iso) return "—";
    const parts = String(iso).split("-");
    if (parts.length < 3) return iso;
    return `${Number(parts[1])}月${Number(parts[2])}日`;
  }

  function formatGenerated(iso) {
    if (!iso) return "—";
    const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return iso;
    return `${Number(m[2])}/${Number(m[3])}`;
  }

  function formatVisitPeriodLabel() {
    const start = mapData?.visit_period_start;
    const end = mapData?.visit_period_end;
    if (!start && !end) return "";
    return `配送回数集計 ${formatJpDate(start)}〜${formatJpDate(end)}`;
  }

  function refreshVisitPeriodLabel() {
    const el = $("#visitPeriodText");
    if (!el) return;
    const label = formatVisitPeriodLabel();
    el.textContent = label;
    el.hidden = !label;
  }

  function defaultStatusText() {
    return `現場 ${mapData.site_count}件 / 更新 ${formatGenerated(mapData.generated)}`;
  }

  function formatVisitLine(site) {
    if (site.visit_count == null) return "運送回数: —";
    const n = Number(site.visit_count) || 0;
    if (n === 0) return "運送回数: 0回";
    const start = site.first_visit;
    const end = site.last_visit;
    if (start && end) {
      return `運送回数: ${n}回（${formatJpDate(start)}〜${formatJpDate(end)}）`;
    }
    if (end) return `運送回数: ${n}回（最終: ${formatJpDate(end)}）`;
    return `運送回数: ${n}回`;
  }

  function formatSitePopup(site) {
    const mc = getMapCourse(site);
    let html = `<b>${escapeHtml(site.name)}</b><br>`;
    html += `地図コース: ${escapeHtml(mc)}`;
    if (site.master_course && site.master_course !== mc) {
      html += `<br>マスタ: ${escapeHtml(site.master_course)}`;
    }
    html += `<br>${escapeHtml(site.address)}`;
    html += `<br>${escapeHtml(formatVisitLine(site))}`;
    return html;
  }

  function clearRoutes() {
    routeLayers.forEach((l) => map.removeLayer(l));
    routeLayers = [];
  }

  function resetHighlight() {
    activeSelections = [];
    showAllShopMarkers();
    clearRoutes();
    hideHint();
    renderSearchTags();
  }

  function selectionKey(sel) {
    if (sel.type === "shop") return `shop:${sel.siteId}`;
    if (sel.type === "shops") return `shops:${sel.siteIds.slice().sort().join(",")}`;
    if (sel.type === "course") return `course:${sel.course}`;
    if (sel.type === "zone") return `zone:${sel.zoneKey}`;
    if (sel.type === "yokomochi") return `yokomochi:${sel.yokomochiId}`;
    if (sel.type === "warehouse") return `warehouse:${sel.warehouseId}`;
    return `raw:${sel.label}`;
  }

  function addSelection(sel) {
    const key = selectionKey(sel);
    if (activeSelections.some((s) => s.key === key)) {
      showHint(`「${sel.label}」は既に表示中です`);
      return false;
    }
    activeSelections.push({ ...sel, key });
    applyAllSelections();
    return true;
  }

  function removeSelection(key) {
    activeSelections = activeSelections.filter((s) => s.key !== key);
    applyAllSelections();
  }

  function renderSearchTags() {
    const el = $("#searchTags");
    if (!el) return;
    if (!activeSelections.length) {
      el.hidden = true;
      el.innerHTML = "";
      return;
    }
    el.hidden = false;
    el.innerHTML = activeSelections
      .map(
        (sel) =>
          `<span class="search-tag">` +
          `<span>${escapeHtml(sel.label)}</span>` +
          `<button type="button" class="search-tag__remove" data-key="${escapeHtml(sel.key)}" aria-label="削除">×</button>` +
          `</span>`
      )
      .join("");
    el.querySelectorAll(".search-tag__remove").forEach((btn) => {
      btn.addEventListener("click", () => removeSelection(btn.dataset.key));
    });
  }

  function applyAllSelections() {
    clearRoutes();
    renderSearchTags();

    if (!activeSelections.length) {
      showAllShopMarkers();
      hideHint();
      $("#statusText").textContent = defaultStatusText();
      return;
    }

    const visibleIds = new Set();
    const highlightMode = new Map();

    activeSelections.forEach((sel) => {
      if (sel.type === "shop") {
        visibleIds.add(sel.siteId);
        highlightMode.set(sel.siteId, "shop");
      } else if (sel.type === "shops") {
        sel.siteIds.forEach((id) => {
          visibleIds.add(id);
          highlightMode.set(id, "shop");
        });
      } else if (sel.type === "course") {
        shopMarkers.forEach(({ site }) => {
          if (getMapCourse(site) === sel.course) {
            visibleIds.add(site.id);
            highlightMode.set(site.id, "course");
          }
        });
      } else if (sel.type === "zone") {
        shopMarkers.forEach(({ site }) => {
          if (site.zone === sel.zoneKey) {
            visibleIds.add(site.id);
            highlightMode.set(site.id, "zone");
          }
        });
      }
    });

    shopMarkers.forEach(({ marker, site }) => {
      if (visibleIds.has(site.id)) {
        const mode = highlightMode.get(site.id);
        const extra =
          mode === "course" ? "is-course-highlight" : "is-zone-highlight";
        marker.setIcon(createShopIcon(site, extra));
        setMarkerVisible(marker, true);
      } else {
        setMarkerVisible(marker, false);
      }
    });

    activeSelections.forEach((sel) => {
      if (sel.type === "course") {
        const matched = shopMarkers
          .map(({ site }) => site)
          .filter((s) => getMapCourse(s) === sel.course && visibleIds.has(s.id));
        const color = getCourseHighlightColor(sel.course);
        const hubId =
          mapData.course_merges?.[sel.course]?.hub ||
          mapData.new_courses?.[sel.course]?.hub ||
          matched[0]?.hub ||
          (sel.course.startsWith("柏") || sel.course.includes("千葉A")
            ? "yachiyo_dp"
            : "esr_kazo");
        drawHubToSites(hubId, matched, color);
      } else if (sel.type === "shop") {
        const site = mapData.sites.find((s) => s.id === sel.siteId);
        if (site) {
          const hubId = site.hub || "yachiyo_dp";
          drawRoute(
            getWarehouse(hubId),
            site,
            getCourseHighlightColor(getMapCourse(site)),
            { weight: 3 }
          );
        }
      } else if (sel.type === "yokomochi") {
        const y = (mapData.yokomochi || []).find((x) => x.id === sel.yokomochiId);
        if (y) {
          const from = getWarehouse(y.from);
          const to = getWarehouse(y.to);
          drawRoute(from, to, YOKOMOCHI_COLOR, { weight: 5 });
        }
      } else if (sel.type === "warehouse") {
        const wh = getWarehouse(sel.warehouseId);
        if (wh) {
          map.setView([wh.lat, wh.lng], 10);
          const wm = warehouseMarkers[sel.warehouseId];
          if (wm) wm.openPopup();
        }
      }
    });

    const visibleSites = shopMarkers
      .map(({ site }) => site)
      .filter((s) => visibleIds.has(s.id));

    if (visibleSites.length) {
      map.fitBounds(
        L.latLngBounds(visibleSites.map((s) => [s.lat, s.lng])),
        { padding: [60, 60], maxZoom: visibleSites.length === 1 ? 14 : 12 }
      );
    } else {
      activeSelections.forEach((sel) => {
        if (sel.type !== "yokomochi") return;
        const y = (mapData.yokomochi || []).find((x) => x.id === sel.yokomochiId);
        if (!y) return;
        const from = getWarehouse(y.from);
        const to = getWarehouse(y.to);
        if (from && to) {
          map.fitBounds(L.latLngBounds([[from.lat, from.lng], [to.lat, to.lng]]), {
            padding: [80, 80],
          });
        }
      });
    }

    const labels = activeSelections.map((s) => s.label).join("、");
    showHint(`${visibleSites.length}件表示中 … ${labels}`);
    $("#statusText").textContent = `表示 ${visibleSites.length}件 / 検索 ${activeSelections.length}件`;
  }

  function findShops(query) {
    const q = norm(query);
    const qCorp = stripCorp(query);
    if (!q) return [];
    const results = [];
    for (const s of mapData.sites) {
      const names = [s.name, ...(s.search_names || []), ...(s.aliases || [])];
      let best = 0;
      for (const name of names) {
        const n = norm(name);
        const nc = stripCorp(name);
        if (n === q || nc === qCorp) best = Math.max(best, 100);
        else if (n.startsWith(q) || nc.startsWith(qCorp)) best = Math.max(best, 80);
        else if (n.includes(q) || nc.includes(qCorp)) best = Math.max(best, 50);
        else if (q.length >= 2 && (q.includes(nc) || nc.includes(qCorp))) {
          best = Math.max(best, 40);
        }
      }
      const addr = norm(s.address || "");
      if (best < 50 && q.length >= 2 && addr.includes(q)) best = 30;
      if (best > 0) results.push({ site: s, score: best });
    }
    results.sort((a, b) => b.score - a.score || a.site.name.localeCompare(b.site.name, "ja"));
    return results;
  }

  function resolveSearchToSelection(raw) {
    const q = norm(raw);
    if (!q) return null;

    const shopHits = findShops(raw);
    const top = shopHits[0];
    if (top && top.score >= 100) {
      return { type: "shop", siteId: top.site.id, label: top.site.name };
    }
    if (top && top.score >= 80 && shopHits.length === 1) {
      return { type: "shop", siteId: top.site.id, label: top.site.name };
    }

    if (q === "千葉A" || q === "千葉ａ" || q.toUpperCase() === "CHIBAA") {
      return { type: "zone", zoneKey: "chiba_a", label: "千葉A" };
    }
    if (q === "千葉B" || q.toUpperCase() === "CHIBAB") {
      return { type: "zone", zoneKey: "chiba_b", label: "千葉B" };
    }
    if (q.includes("横持") || q.includes("ヨコモチ")) {
      const id =
        q.includes("木更津") || q.includes("NBS")
          ? "yokomochi_kisarazu"
          : "yokomochi_yachiyo";
      const y = (mapData.yokomochi || []).find((x) => x.id === id);
      return { type: "yokomochi", yokomochiId: id, label: y?.name || "横持ち" };
    }
    if (q === "房" || /^房[館勝君木]/.test(q)) {
      return { type: "zone", zoneKey: "funa", label: "房" };
    }
    if (q.includes("八千代") && q.includes("DP")) {
      return { type: "yokomochi", yokomochiId: "yokomochi_yachiyo", label: "八千代DP横持ち" };
    }
    if (q.includes("ESR") || q === "加須") {
      return { type: "warehouse", warehouseId: "esr_kazo", label: "ESR加須" };
    }
    if (q === "NBS" || q.includes("木更津DP")) {
      return { type: "yokomochi", yokomochiId: "yokomochi_kisarazu", label: "木更津横持ち" };
    }

    const course = resolveCourse(q);
    if (course) {
      return { type: "course", course, label: course };
    }

    if (top && top.score >= 50) {
      if (shopHits.length === 1) {
        return { type: "shop", siteId: top.site.id, label: top.site.name };
      }
      const strong = shopHits.filter((h) => h.score >= 50);
      if (strong.length > 1 && strong.length <= 12) {
        return {
          type: "shops",
          siteIds: strong.map((h) => h.site.id),
          label: `「${raw}」${strong.length}件`,
        };
      }
      if (strong.length === 1) {
        return { type: "shop", siteId: strong[0].site.id, label: strong[0].site.name };
      }
    }

    return null;
  }

  function addSelectionFromQuery(raw) {
    const q = norm(raw);
    if (!q) return;
    const sel = resolveSearchToSelection(raw);
    if (!sel) {
      showHint(`「${raw}」に一致なし。候補から選ぶか: 千葉A / 2S / 工務店名`);
      return;
    }
    if (addSelection(sel)) {
      $("#searchInput").value = "";
      hideSuggestions();
    }
  }

  function handleSearch(raw) {
    addSelectionFromQuery(raw);
  }

  function highlightZone(zoneKey, label) {
    addSelection({ type: "zone", zoneKey, label });
  }

  function highlightCourse(course) {
    addSelection({ type: "course", course, label: course });
  }

  function highlightSingleShop(site) {
    addSelection({ type: "shop", siteId: site.id, label: site.name });
    shopMarkers.forEach(({ marker, site: s }) => {
      if (s.id === site.id) marker.openPopup();
    });
  }

  function showYokomochi(type) {
    const y = (mapData.yokomochi || []).find((x) => x.id === type);
    if (!y) return;
    addSelection({ type: "yokomochi", yokomochiId: type, label: y.name });
  }

  function showWarehouse(wid) {
    if (wid === "yachiyo_dp") {
      showYokomochi("yokomochi_yachiyo");
      return;
    }
    if (wid === "nbs") {
      showYokomochi("yokomochi_kisarazu");
      return;
    }
    const wh = getWarehouse(wid);
    if (!wh) return;
    map.setView([wh.lat, wh.lng], 10);
    showHint(`${wh.name}（倉庫・赤）`);
    $("#statusText").textContent = wh.name;
  }

  function showHint(text) {
    const el = $("#searchHint");
    el.textContent = text;
    el.classList.add("is-visible");
  }

  function hideHint() {
    const el = $("#searchHint");
    el.classList.remove("is-visible");
  }

  function getWarehouse(id) {
    return (mapData.warehouses || []).find((w) => w.id === id);
  }

  function drawRoute(from, to, color, opts = {}) {
    if (!from || !to) return;
    const latlngs = [
      [from.lat, from.lng],
      [to.lat, to.lng],
    ];
    const line = L.polyline(latlngs, {
      color,
      weight: opts.weight || 3,
      opacity: 0.35,
      dashArray: "6 8",
    }).addTo(map);

    const ant = L.polyline.antPath(latlngs, {
      delay: 280,
      dashArray: [12, 18],
      weight: opts.weight || 4,
      color,
      pulseColor: "#ffffff",
      opacity: 0.9,
    }).addTo(map);

    routeLayers.push(line, ant);
  }

  function drawHubToSites(hubId, sites, color) {
    const hub = getWarehouse(hubId);
    if (!hub) return;
    sites.forEach((site) => {
      drawRoute(hub, site, color, { weight: 2.5 });
    });
  }

  function buildSearchCatalog() {
    const items = [
      { value: "千葉A", label: "千葉A", meta: "柏1H〜5P・八千代DP", category: "エリア", priority: 1 },
      { value: "千葉B", label: "千葉B", meta: "千Aア〜千J6・ESR加須", category: "エリア", priority: 1 },
      { value: "房", label: "房", meta: "房館1〜房木5・NBS方面", category: "エリア", priority: 1 },
      { value: "八千代DP", label: "八千代DP", meta: "倉庫（赤）", category: "倉庫", priority: 1 },
      { value: "ESR加須", label: "ESR加須", meta: "倉庫（赤）", category: "倉庫", priority: 1 },
      { value: "NBS", label: "NBS", meta: "木更津DP・倉庫（赤）", category: "倉庫", priority: 1 },
      { value: "横持ち", label: "横持ち", meta: "八千代DP → ESR加須", category: "横持ち", priority: 1 },
      { value: "木更津横持", label: "木更津横持", meta: "ESR加須 → 木更津", category: "横持ち", priority: 1 },
    ];
    const seen = new Set(items.map((i) => norm(i.value)));

    for (const group of allCourseGroups()) {
      for (const c of group.courses) {
        const key = norm(c);
        if (seen.has(key)) continue;
        seen.add(key);
        items.push({
          value: c,
          label: c,
          meta: courseSearchMeta(c),
          category: "コース",
          priority: 2,
          group: group.title,
        });
      }
    }

    for (const s of mapData.sites || []) {
      const names = [s.name, ...(s.search_names || [])];
      for (const name of names) {
        const key = norm(name);
        if (!key || seen.has(key)) continue;
        seen.add(key);
        items.push({
          value: name,
          label: name,
          meta: getMapCourse(s),
          category: "工務店",
          priority: 3,
          siteId: s.id,
        });
      }
    }

    searchCatalog = items;
  }

  function filterSuggestions(query) {
    const q = norm(query);
    let pool = searchCatalog;
    if (!q) {
      return pool.filter((i) => i.priority < 3);
    }
    return pool
      .filter((i) => {
        const blob = norm(`${i.value}${i.label}${i.meta}${i.category}${i.group || ""}`);
        return blob.includes(q);
      })
      .sort((a, b) => a.priority - b.priority)
      .slice(0, 18);
  }

  function hideSuggestions() {
    const el = $("#searchSuggestions");
    el.hidden = true;
    el.innerHTML = "";
    suggestionActiveIndex = -1;
  }

  function renderSuggestions(items) {
    const el = $("#searchSuggestions");
    if (!items.length) {
      hideSuggestions();
      return;
    }
    el.innerHTML = items
      .map(
        (item, idx) =>
          `<li class="search-suggestions__item${idx === suggestionActiveIndex ? " is-active" : ""}" role="option" data-idx="${idx}" data-value="${escapeHtml(item.value)}">` +
          `<span class="search-suggestions__cat">${escapeHtml(item.category)}</span>` +
          `<span class="search-suggestions__label">${escapeHtml(item.label)}</span>` +
          `<span class="search-suggestions__meta">${escapeHtml(item.meta)}</span>` +
          `</li>`
      )
      .join("");
    el.hidden = false;
    el._items = items;
  }

  function showSuggestionsForInput() {
    const input = $("#searchInput");
    renderSuggestions(filterSuggestions(input.value));
  }

  function pickSuggestion(value) {
    const input = $("#searchInput");
    const list = $("#searchSuggestions");
    const item = (list._items || []).find((i) => i.value === value);
    input.value = "";
    hideSuggestions();
    if (item?.siteId) {
      addSelection({ type: "shop", siteId: item.siteId, label: item.label });
      return;
    }
    addSelectionFromQuery(value);
  }

  function bindSearchSuggestions() {
    const input = $("#searchInput");
    const list = $("#searchSuggestions");

    input.addEventListener("focus", () => showSuggestionsForInput());
    input.addEventListener("input", () => {
      suggestionActiveIndex = -1;
      showSuggestionsForInput();
    });

    list.addEventListener("mousedown", (e) => {
      const li = e.target.closest(".search-suggestions__item");
      if (!li) return;
      e.preventDefault();
      pickSuggestion(li.dataset.value);
    });

    input.addEventListener("keydown", (e) => {
      const items = list._items || [];
      if (e.key === "ArrowDown") {
        if (list.hidden && items.length === 0) showSuggestionsForInput();
        const visible = list._items || [];
        if (!visible.length) return;
        e.preventDefault();
        suggestionActiveIndex = Math.min(suggestionActiveIndex + 1, visible.length - 1);
        renderSuggestions(visible);
        return;
      }
      if (e.key === "ArrowUp") {
        const visible = list._items || [];
        if (!visible.length) return;
        e.preventDefault();
        suggestionActiveIndex = Math.max(suggestionActiveIndex - 1, 0);
        renderSuggestions(visible);
        return;
      }
      if (e.key === "Escape") {
        hideSuggestions();
        return;
      }
      if (e.key === "Enter") {
        if (!list.hidden && suggestionActiveIndex >= 0 && items[suggestionActiveIndex]) {
          e.preventDefault();
          pickSuggestion(items[suggestionActiveIndex].value);
          return;
        }
        hideSuggestions();
        handleSearch(input.value);
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) hideSuggestions();
    });
  }

  function buildLegend() {
    const el = $("#legend");
    const zones = mapData.zones || {};
    const ml = mapData.marker_legend || {};
    let html = "<h3>区分・形状</h3>";
    html += `<div class="legend-row"><span class="legend-swatch legend-swatch--circle"></span>${ml.circle || "通常（丸）"}</div>`;
    html += `<div class="legend-row"><span class="legend-swatch legend-swatch--triangle"></span>${ml.triangle || "2t（三角）"}</div>`;
    html += `<div class="legend-row"><span class="legend-swatch legend-swatch--square"></span>${ml.square || "4t（四角）"}</div>`;
    html += `<div class="legend-row"><span class="legend-swatch" style="background:#ff4757"></span>倉庫（赤）</div>`;
    html += "<h3 style='margin-top:10px'>コース一覧</h3>";
    for (const group of allCourseGroups()) {
      html += `<div class="legend-group">${escapeHtml(group.title)}</div>`;
      for (const c of group.courses) {
        html += `<div class="legend-row legend-row--course"><button type="button" class="legend-course-btn" data-course="${escapeHtml(c)}">${escapeHtml(c)}</button></div>`;
      }
    }
    html += "<h3 style='margin-top:10px'>エリア</h3>";
    for (const [, z] of Object.entries(zones)) {
      html += `<div class="legend-row"><span>${z.label}</span></div>`;
    }
    el.innerHTML = html;
    el.querySelectorAll(".legend-course-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const course = btn.dataset.course;
        $("#searchInput").value = "";
        hideSuggestions();
        addSelection({ type: "course", course, label: course });
      });
    });
  }

  function initMap() {
    map = L.map("map", {
      zoomControl: true,
      minZoom: 8,
      maxZoom: 16,
    }).setView([35.45, 140.25], 9);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap",
      maxZoom: 18,
    }).addTo(map);

    // 千葉県市町村界
    fetch(GEOJSON_URL)
      .then((r) => r.json())
      .then((geo) => {
        cityLayer = L.geoJSON(geo, {
          style: {
            className: "chiba-city",
            fillColor: "#e8f0f8",
            fillOpacity: 0.65,
            color: "#8aa4bc",
            weight: 1,
          },
          onEachFeature(f, layer) {
            const name = f.properties?.N03_004 || f.properties?.name || "";
            if (name) layer.bindTooltip(name, { sticky: true, opacity: 0.85 });
          },
        }).addTo(map);

        const bounds = cityLayer.getBounds();
        if (bounds.isValid()) {
          map.fitBounds(bounds.pad(0.05));
        }
      })
      .catch(() => {
        map.setView([35.45, 140.25], 9);
      });

    // 倉庫（常時表示・赤）
    (mapData.warehouses || []).forEach((wh) => {
      const marker = L.marker([wh.lat, wh.lng], {
        icon: createWarehouseIcon(wh),
        zIndexOffset: 1000,
      })
        .bindPopup(`<b>${escapeHtml(wh.name)}</b><br>${escapeHtml(wh.address)}`)
        .addTo(map);
      warehouseMarkers[wh.id] = marker;
    });

    // 工務店（常時表示・青。調べる／クリックでハイライト色）
    (mapData.sites || []).forEach((site) => {
      const marker = L.marker([site.lat, site.lng], {
        icon: createShopIcon(site),
        zIndexOffset: 100,
      })
        .bindPopup(formatSitePopup(site))
        .addTo(map);
      marker.on("click", () => highlightSingleShop(site));
      shopMarkers.push({ marker, site });
    });

    // ESR加須は千葉外 →  bounds に含める
    const allPts = [
      ...(mapData.sites || []).map((s) => [s.lat, s.lng]),
      ...(mapData.warehouses || []).map((w) => [w.lat, w.lng]),
    ];
    if (allPts.length) {
      map.fitBounds(L.latLngBounds(allPts), { padding: [40, 40], maxZoom: 10 });
    }

    $("#statusText").textContent = defaultStatusText();
    refreshVisitPeriodLabel();
    scheduleMapInvalidate();
  }

  function scheduleMapInvalidate() {
    if (!map) return;
    const run = () => {
      map.invalidateSize(true);
    };
    run();
    requestAnimationFrame(run);
    setTimeout(run, 50);
    setTimeout(run, 250);
    setTimeout(run, 800);
  }

  function bindEvents() {
    $("#searchBtn").addEventListener("click", () => {
      hideSuggestions();
      handleSearch($("#searchInput").value);
    });
    $("#resetBtn").addEventListener("click", () => {
      $("#searchInput").value = "";
      hideSuggestions();
      resetHighlight();
      $("#statusText").textContent = defaultStatusText();
    });
    bindSearchSuggestions();
  }

  function setStatus(text) {
    const el = $("#statusText");
    if (el) el.textContent = text;
  }

  function liveVersionUrl() {
    const meta = document.querySelector('meta[name="chiba-map-live-base"]');
    if (meta?.content?.trim()) {
      return meta.content.trim().replace(/\/?$/, "/") + ".version.json";
    }
    if (IS_WEB_HOST) {
      return new URL(".version.json", window.location.href).toString();
    }
    return ".version.json";
  }

  function pageBuildStamp() {
    return document.querySelector('meta[name="chiba-map-build"]')?.content?.trim() || "";
  }

  async function fetchLiveVersionMeta() {
    try {
      const r = await fetch(`${liveVersionUrl()}?v=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) return null;
      return await r.json();
    } catch (_) {
      return null;
    }
  }

  async function maybeReloadForLatestBuild() {
    if (!IS_WEB_HOST && !document.querySelector('meta[name="chiba-map-live-base"]')) {
      return;
    }
    const ver = await fetchLiveVersionMeta();
    if (!ver?.built) return;

    const pageBuild = pageBuildStamp();
    const staleHtml = pageBuild && ver.built > pageBuild;
    const reloadKey = "chiba-map-reloaded-for";
    if (staleHtml && sessionStorage.getItem(reloadKey) !== ver.built) {
      sessionStorage.setItem(reloadKey, ver.built);
      const url = new URL(window.location.href);
      url.searchParams.set("_", String(Date.now()));
      window.location.replace(url.toString());
      await new Promise(() => {});
    }
  }

  async function loadMapDataOnce() {
    if (typeof L === "undefined") {
      throw new Error("地図ライブラリ（Leaflet）が読み込めません。ネット接続を確認して再読込してください。");
    }

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);

    try {
      const r = await fetch(`${DATA_URL}?v=${Date.now()}`, {
        signal: controller.signal,
        cache: "no-store",
      });
      clearTimeout(timer);
      if (!r.ok) {
        throw new Error(
          IS_WEB_HOST
            ? "map_data.json を読めません。ページを再読込（Ctrl+F5）するか、しばらく待ってから再度開いてください。"
            : "map_data.json を読めません。ターミナルで cd AI化/千葉配送地図 && python3 -m http.server 8765 を実行してください。"
        );
      }
      const data = await r.json();
      const ver = await fetchLiveVersionMeta();
      if (ver?.map_generated && data.generated && ver.map_generated > data.generated) {
        const reloadKey = "chiba-map-data-reloaded-for";
        if (sessionStorage.getItem(reloadKey) !== ver.map_generated) {
          sessionStorage.setItem(reloadKey, ver.map_generated);
          const url = new URL(window.location.href);
          url.searchParams.set("_", String(Date.now()));
          window.location.replace(url.toString());
          await new Promise(() => {});
        }
      }
      return data;
    } catch (err) {
      clearTimeout(timer);
      if (err.name === "AbortError") {
        throw new Error(
          IS_WEB_HOST
            ? "地図データの読込がタイムアウトしました。回線を確認して再読込してください。"
            : "地図データの読込がタイムアウトしました。サーバーを再起動してページを再読込してください。"
        );
      }
      if (err instanceof TypeError) {
        throw new Error(
          IS_WEB_HOST
            ? "地図データに接続できません。URLを確認するか、しばらく待ってから再読込してください。"
            : "地図サーバーに接続できません。python3 -m http.server 8765 が起動しているか確認してください。"
        );
      }
      throw err;
    }
  }

  async function loadMapDataWithRetry(maxAttempts = 4) {
    let lastErr;
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      try {
        return await loadMapDataOnce();
      } catch (err) {
        lastErr = err;
        if (attempt < maxAttempts - 1) {
          await new Promise((resolve) => setTimeout(resolve, 350 * (attempt + 1)));
        }
      }
    }
    throw lastErr;
  }

  function enforceLiveAccess() {
    const meta = document.querySelector('meta[name="chiba-map-access-key"]');
    if (!meta?.content?.trim()) return;
    const required = meta.content.trim();
    const got = new URLSearchParams(window.location.search).get("k") || "";
    if (got !== required) {
      throw new Error(
        "この地図は共有URLから開いてください。開く.bat または社長から受け取ったリンクをご利用ください。"
      );
    }
  }

  function startLiveVersionWatch(initialBuilt) {
    if (!IS_WEB_HOST && !document.querySelector('meta[name="chiba-map-live-base"]')) {
      return;
    }
    let current = initialBuilt || pageBuildStamp() || "";
    async function poll() {
      const v = await fetchLiveVersionMeta();
      if (!v?.built) return;
      if (current && v.built > current) {
        showHint("新しい版があります。再読込します…");
        setTimeout(() => {
          const url = new URL(window.location.href);
          url.searchParams.set("_", String(Date.now()));
          window.location.replace(url.toString());
        }, 400);
      }
    }
    poll();
    setInterval(poll, 20000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") poll();
    });
    window.addEventListener("pageshow", (ev) => {
      if (ev.persisted) {
        scheduleMapInvalidate();
        poll();
      }
    });
  }

  async function bootstrap() {
    try {
      enforceLiveAccess();
      await maybeReloadForLatestBuild();
      const data = await loadMapDataWithRetry();
      mapData = data;
      const hasVisit = (data.sites || []).some((s) => "visit_count" in s);
      if ((data.sites || []).length && !hasVisit) {
        throw new Error(
          "地図データが古いです。Cmd+Shift+R で再読込するか、python3 build_chiba_map_data.py を実行してください。"
        );
      }
      enrichSearchAliases();
      buildHighlightColors();
      buildSearchCatalog();
      buildLegend();
      initMap();
      bindEvents();
      window.addEventListener("load", scheduleMapInvalidate);
      window.addEventListener("resize", scheduleMapInvalidate);
      const ver = await fetchLiveVersionMeta();
      startLiveVersionWatch(ver?.built || data.generated);
    } catch (err) {
      setStatus(err.message);
      showHint(err.message);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootstrap);
  } else {
    bootstrap();
  }
})();

  <script>
/**
 * 千葉配送地図 — 協調編集 UI（工務店追加・コース変更・コース作成）
 */
(function () {
  "use strict";

  let api = null;
  let selectedSiteIds = new Set();
  let selectedHubId = "";
  let shopSearchCatalog = [];
  let createPreviewLayers = [];
  let activeTab = "add";

  let cachedApiBase = null;

  async function collabHealthOk(base, { requireDelete = false } = {}) {
    try {
      const r = await fetch(`${base}/api/map-collab/health`, { cache: "no-store" });
      if (!r.ok) return false;
      const data = await r.json().catch(() => ({}));
      if (!data.ok) return false;
      if (!requireDelete) return true;
      const caps = data.capabilities;
      return Array.isArray(caps) && caps.includes("delete_course");
    } catch (_) {
      return false;
    }
  }

  async function resolveApiBase({ requireDelete = false } = {}) {
    if (!requireDelete && cachedApiBase !== null) return cachedApiBase;
    const meta = document.querySelector('meta[name="chiba-map-collab-api"]');
    if (meta?.content?.trim()) {
      const metaBase = meta.content.trim().replace(/\/$/, "");
      if (await collabHealthOk(metaBase, { requireDelete })) {
        if (!requireDelete) cachedApiBase = metaBase;
        return metaBase;
      }
    }
    const origin = window.location.origin.replace(/\/$/, "");
    if (/^https?:/.test(window.location.protocol) && (await collabHealthOk(origin, { requireDelete }))) {
      if (!requireDelete) cachedApiBase = origin;
      return origin;
    }
    if (!requireDelete) cachedApiBase = "";
    return "";
  }

  function editKey() {
    return sessionStorage.getItem("chiba-map-edit-key") || "";
  }

  function setEditKey(k) {
    sessionStorage.setItem("chiba-map-edit-key", k);
  }

  async function postJson(path, body) {
    const actions = body?.actions || [];
    const requireDelete = actions.some((a) => a.type === "delete_course");
    const base = await resolveApiBase({ requireDelete });
    if (!base) {
      throw new Error(
        requireDelete
          ? "編集サーバーが古いバージョンです。地図を一度閉じ、デスクトップの「千葉配送地図を開く」から開き直してください。"
          : "編集APIに接続できません。地図を一度閉じ、デスクトップの「千葉配送地図を開く」から開き直してください。"
      );
    }
    let r;
    try {
      r = await fetch(`${base}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Map-Edit-Key": editKey() },
        body: JSON.stringify({ ...body, edit_key: editKey() }),
      });
    } catch (_) {
      throw new Error(
        "編集APIに接続できません。地図を一度閉じ、デスクトップの「千葉配送地図を開く」から開き直してください。"
      );
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (data.error === "invalid_edit_key") {
        throw new Error("合言葉が違います。編集を開き直して合言葉を入れ直してください。");
      }
      if (String(data.error || "").startsWith("unknown_action:")) {
        throw new Error(
          "編集サーバーが古いバージョンです。地図を一度閉じ、デスクトップの「千葉配送地図を開く」から開き直してください。"
        );
      }
      throw new Error(data.error || `HTTP ${r.status}`);
    }
    return data;
  }

  async function ensureEditKey() {

    setEditKey(k);

  async function submitActions(actions, statusEl) {
    if (!(await ensureEditKey())) return;
    statusEl.textContent = "反映中…";
    try {
      const res = await postJson("/api/map-collab", { actions, by: "地図ユーザー" });
      const wantsDeleteCourse = actions.some((a) => a.type === "delete_course");
      if (wantsDeleteCourse && !(res.log || []).some((line) => String(line).includes("コース削除"))) {
        throw new Error("コース削除が反映されませんでした。地図を開き直してから再試行してください。");
      }
      if (wantsDeleteCourse && res.rebuilt === false) {
        throw new Error(
          "コースは削除しましたが地図データの更新に失敗しました。地図を一度閉じて「千葉配送地図を開く」から開き直してください。"
        );
      }
      statusEl.textContent = res.message || "反映しました";
      api.setStatus("反映しました。再読込します…");
      setTimeout(() => {
        const url = new URL(window.location.href);
        url.searchParams.set("_", String(Date.now()));
        window.location.replace(url.toString());
      }, 1200);
    } catch (err) {
      statusEl.textContent = err.message || String(err);
    }
  }

  function normSearchText(s) {
    return (s || "").normalize("NFKC").trim().replace(/\s+/g, "");
  }

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildShopSearchCatalog(sites) {
    const items = [];
    const seen = new Set();
    for (const s of sites || []) {
      const names = [s.name, ...(s.search_names || [])];
      for (const name of names) {
        const key = normSearchText(name);
        if (!key || seen.has(key)) continue;
        seen.add(key);
        items.push({
          value: name,
          label: name,
          meta: api.getMapCourse(s),
          category: "工務店",
          siteId: s.id,
        });
      }
    }
    shopSearchCatalog = items;
  }

  function filterShopSuggestions(query) {
    const q = normSearchText(query);
    if (!q) return [];
    return shopSearchCatalog
      .filter((item) => {
        const blob = normSearchText(`${item.value}${item.label}${item.meta}${item.category}`);
        return blob.includes(q);
      })
      .slice(0, 18);
  }

  function hideShopSuggestions(listEl) {
    if (!listEl) return;
    listEl.hidden = true;
    listEl.innerHTML = "";
    listEl._items = [];
    listEl._activeIndex = -1;
  }

  function renderShopSuggestions(listEl, items) {
    if (!listEl) return;
    const activeIndex = listEl._activeIndex ?? -1;
    if (!items.length) {
      hideShopSuggestions(listEl);
      return;
    }
    listEl.innerHTML = items
      .map(
        (item, idx) =>
          `<li class="search-suggestions__item${idx === activeIndex ? " is-active" : ""}" role="option" data-value="${escapeHtml(item.value)}">` +
          `<span class="search-suggestions__cat">${escapeHtml(item.category)}</span>` +
          `<span class="search-suggestions__label">${escapeHtml(item.label)}</span>` +
          `<span class="search-suggestions__meta">${escapeHtml(item.meta)}</span>` +
          `</li>`
      )
      .join("");
    listEl.hidden = false;
    listEl._items = items;
  }

  function clearShopPick({ hiddenId, pickedId, searchId, suggestionsId }) {
    const hidden = document.getElementById(hiddenId);
    const picked = document.getElementById(pickedId);
    const search = document.getElementById(searchId);
    const list = document.getElementById(suggestionsId);
    if (hidden) hidden.value = "";
    if (picked) {
      picked.hidden = true;
      picked.textContent = "";
    }
    if (search) search.value = "";

  }

  function pickShop({ item, hiddenId, pickedId, searchId, suggestionsId }) {
    const hidden = document.getElementById(hiddenId);
    const picked = document.getElementById(pickedId);

  }

  function toggleCreateSite(item) {
    if (!item?.siteId) return;
    if (selectedSiteIds.has(item.siteId)) selectedSiteIds.delete(item.siteId);
    else selectedSiteIds.add(item.siteId);
    renderSelectedList();
    updateCreatePreview();
    api.highlightSiteById(item.siteId, "#e056fd");
    if (api.flyToSite) api.flyToSite(item.siteId);

  function clearCreatePreview() {
    const map = api?.getMap?.();
    if (!map) return;
    createPreviewLayers.forEach((layer) => {
      try {
        map.removeLayer(layer);
      } catch (_) {
        /* ignore */
      }
    });
    createPreviewLayers = [];
  }

  function resolvePreviewLatLng(ref) {
    if (!ref) return null;
    if (ref.lat != null && ref.lng != null && typeof ref.getLatLng !== "function") {
      return L.latLng(ref.lat, ref.lng);
    }
    if (typeof ref.getLatLng === "function") return ref.getLatLng();
    if (ref.lat != null && ref.lng != null) return L.latLng(ref.lat, ref.lng);
    return null;
  }

  function inferHubForSite(site) {
    if (!site) return null;
    if (site.hub) return site.hub;
    const mapData = api.getMapData();
    const zoneHub = mapData.zones?.[site.zone]?.hub;
    if (zoneHub) return zoneHub;
    const course = api.getMapCourse(site);
    return (
      mapData.course_merges?.[course]?.hub ||
      mapData.new_courses?.[course]?.hub ||
      (course && (course.startsWith("柏") || course.includes("千葉A")) ? "yachiyo_dp" : "esr_kazo")
    );
  }

  function getSiteLatLng(siteId) {
    const hit = (api.getShopMarkers?.() || []).find((m) => m.site?.id === siteId);
    const fromMarker = resolvePreviewLatLng(hit?.marker) || resolvePreviewLatLng(hit?.site);
    if (fromMarker) return fromMarker;
    const site = (api.getMapData().sites || []).find((s) => s.id === siteId);
    return resolvePreviewLatLng(site);
  }

  function getHubLatLng(hubId) {
    const whEntry = (api.getWarehouseMarkers?.() || []).find((x) => x.id === hubId);
    const fromMarker = resolvePreviewLatLng(whEntry?.marker) || resolvePreviewLatLng(whEntry?.warehouse);
    if (fromMarker) return fromMarker;
    const wh = (api.getMapData().warehouses || []).find((w) => w.id === hubId);
    return resolvePreviewLatLng(wh);
  }

  function ensurePreviewPane(map) {
    if (!map.getPane("collabPreviewPane")) {
      map.createPane("collabPreviewPane");
      map.getPane("collabPreviewPane").style.zIndex = 450;
    }
  }

  function updateCreatePreview() {
    clearCreatePreview();
    if (activeTab !== "create") return;
    if (selectedSiteIds.size === 0) return;
    const map = api?.getMap?.();
    if (!map || !window.L) return;

    ensurePreviewPane(map);

    const sites = api.getMapData().sites || [];
    let hubId = selectedHubId;
    if (!hubId) {
      const firstSite = sites.find((s) => selectedSiteIds.has(s.id));
      hubId = inferHubForSite(firstSite);
    }
    if (!hubId) return;

    const hubLl = getHubLatLng(hubId);
    if (!hubLl) return;

    const provisional = !selectedHubId;
    for (const id of selectedSiteIds) {
      const siteLl = getSiteLatLng(id);
      if (!siteLl) continue;
      const line = L.polyline([hubLl, siteLl], {
        pane: "collabPreviewPane",
        color: "#e056fd",
        weight: 2.5,
        opacity: provisional ? 0.6 : 0.85,
        dashArray: provisional ? "8 6" : null,
        className: "collab-create-preview-line",
      }).addTo(map);
      createPreviewLayers.push(line);
    }
  }

  async function fetchCollabData() {
    const base = await resolveApiBase();
    if (!base) return null;
    try {
      const r = await fetch(`${base}/api/map-collab`, { cache: "no-store" });
      if (!r.ok) return null;
      const data = await r.json();
      return data.collab || null;
    } catch (_) {
      return null;
    }
  }

  async function fillDeletableCourses() {
    const sel = document.getElementById("collabDeleteCourse");
    const btn = document.getElementById("collabConfirmDeleteCourse");
    if (!sel) return;

    sel.innerHTML = '<option value="">読込中…</option>';

      collab?.custom_courses ||
      api?.getMapData()?.collab_custom_courses ||

    if (!names.length) {
      sel.innerHTML = '<option value="">削除できるコースがありません</option>';
      if (btn) btn.disabled = true;
      return;

    sel.innerHTML = names
      .map((n) => {

        return `<option value="${escapeHtml(n)}">${escapeHtml(n)}（${nshop}店）</option>`;
      })
      .join("");

  }

  function bindMultiShopSearch({ searchId, suggestionsId }) {
    const search = document.getElementById(searchId);
    const list = document.getElementById(suggestionsId);
    if (!search || !list) return;

    list._activeIndex = -1;

    const showSuggestions = () => {
      list._activeIndex = -1;
      renderShopSuggestions(list, filterShopSuggestions(search.value));
    };

    search.addEventListener("focus", showSuggestions);
    search.addEventListener("input", showSuggestions);

    list.addEventListener("mousedown", (e) => {
      const li = e.target.closest(".search-suggestions__item");
      if (!li) return;
      e.preventDefault();
      const item = (list._items || []).find((x) => x.value === li.dataset.value);
      toggleCreateSite(item);
      search.value = "";
      hideShopSuggestions(list);
    });

    search.addEventListener("keydown", (e) => {
      const items = list._items || [];
      if (e.key === "ArrowDown") {
        if (list.hidden) showSuggestions();
        const visible = list._items || [];
        if (!visible.length) return;
        e.preventDefault();
        list._activeIndex = Math.min((list._activeIndex ?? -1) + 1, visible.length - 1);
        renderShopSuggestions(list, visible);
        return;
      }
      if (e.key === "ArrowUp") {
        const visible = list._items || [];
        if (!visible.length) return;
        e.preventDefault();
        list._activeIndex = Math.max((list._activeIndex ?? 0) - 1, 0);
        renderShopSuggestions(list, visible);
        return;
      }
      if (e.key === "Escape") {
        hideShopSuggestions(list);
        return;
      }
      if (e.key === "Enter") {
        if (!list.hidden && list._activeIndex >= 0 && items[list._activeIndex]) {
          e.preventDefault();
          toggleCreateSite(items[list._activeIndex]);
          search.value = "";
          hideShopSuggestions(list);
        }
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(`#${searchId}`) && !e.target.closest(`#${suggestionsId}`)) {
        hideShopSuggestions(list);
      }
    });
  }

  function clearCreateTabState() {

  function bindShopPicker({ searchId, suggestionsId, hiddenId, pickedId }) {
    const search = document.getElementById(searchId);
    const list = document.getElementById(suggestionsId);
    if (!search || !list) return;

    list._activeIndex = -1;

    const showSuggestions = () => {
      list._activeIndex = -1;
      renderShopSuggestions(list, filterShopSuggestions(search.value));
    };

    search.addEventListener("focus", showSuggestions);
    search.addEventListener("input", () => {
      const hidden = document.getElementById(hiddenId);
      if (hidden) hidden.value = "";
      const picked = document.getElementById(pickedId);
      if (picked) {
        picked.hidden = true;
        picked.textContent = "";
      }
      showSuggestions();
    });

    list.addEventListener("mousedown", (e) => {
      const li = e.target.closest(".search-suggestions__item");
      if (!li) return;
      e.preventDefault();
      const item = (list._items || []).find((x) => x.value === li.dataset.value);
      pickShop({ item, hiddenId, pickedId, searchId, suggestionsId });
    });

    search.addEventListener("keydown", (e) => {
      const items = list._items || [];
      if (e.key === "ArrowDown") {
        if (list.hidden) showSuggestions();
        const visible = list._items || [];
        if (!visible.length) return;
        e.preventDefault();
        list._activeIndex = Math.min((list._activeIndex ?? -1) + 1, visible.length - 1);
        renderShopSuggestions(list, visible);
        return;
      }
      if (e.key === "ArrowUp") {
        const visible = list._items || [];
        if (!visible.length) return;
        e.preventDefault();
        list._activeIndex = Math.max((list._activeIndex ?? 0) - 1, 0);
        renderShopSuggestions(list, visible);
        return;
      }
      if (e.key === "Escape") {
        hideShopSuggestions(list);
        return;
      }
      if (e.key === "Enter") {
        if (!list.hidden && list._activeIndex >= 0 && items[list._activeIndex]) {
          e.preventDefault();
          pickShop({ item: items[list._activeIndex], hiddenId, pickedId, searchId, suggestionsId });
        }
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(`#${searchId}`) && !e.target.closest(`#${suggestionsId}`)) {
        hideShopSuggestions(list);
      }
    });
  }

  function ensureCollabSearchStyles() {

  async function refreshCreateStats() {
    const box = document.getElementById("collabCreateStats");
    if (!box || selectedSiteIds.size === 0) {
      if (box) box.hidden = true;
      return;
    }
    const ids = [...selectedSiteIds];
    const sites = api.getMapData().sites || [];
    let totalKg = 0;
    let totalVis = 0;
    const rows = ids
      .map((id) => sites.find((s) => s.id === id))
      .filter(Boolean)
      .map((s) => {
        const w = Number(s.weight_kg) || 0;
        const v = Number(s.visit_count) || 0;
        totalKg += w;
        totalVis += v;
        return `<li>${s.name} … ${v}回 / ${w}kg</li>`;
      });
    box.hidden = false;
    box.innerHTML = `<strong>合計</strong> ${ids.length}店 · ${totalVis}回 · ${totalKg}kg<ul>${rows.join("")}</ul>`;
  }

  function bindPanel(panel) {
    const groups = api.allCourseGroups();
    fillCourseSelects(groups);
    ensureCollabSearchStyles();
    buildShopSearchCatalog(api.getMapData().sites);
    bindShopPicker({
      searchId: "collabMoveSiteSearch",
      suggestionsId: "collabMoveSiteSuggestions",
      hiddenId: "collabMoveSiteId",
      pickedId: "collabMoveSitePicked",
    });
    bindShopPicker({
      searchId: "collabDeleteSiteSearch",
      suggestionsId: "collabDeleteSiteSuggestions",
      hiddenId: "collabDeleteSiteId",
      pickedId: "collabDeleteSitePicked",
    });
    bindMultiShopSearch({
      searchId: "collabCreateSiteSearch",
      suggestionsId: "collabCreateSiteSuggestions",
    });
    const status = document.getElementById("collabStatus");

    panel.querySelector(".collab-editor__close").addEventListener("click", () => {
      panel.hidden = true;
      clearCreatePreview();
      api.resetMarkerStyles();
    });

    panel.querySelectorAll(".collab-editor__tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        panel.querySelectorAll(".collab-editor__tabs button").forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        const tab = btn.dataset.tab;
        activeTab = tab;
        panel.querySelectorAll("[data-panel]").forEach((p) => {
          p.hidden = p.dataset.panel !== tab;
        });
        if (tab === "create") {
          clearCreateTabState();
        } else {
          clearCreatePreview();
          api.resetMarkerStyles();
        }
        if (tab === "move") {
          clearShopPick({
            hiddenId: "collabMoveSiteId",
            pickedId: "collabMoveSitePicked",
            searchId: "collabMoveSiteSearch",
            suggestionsId: "collabMoveSiteSuggestions",
          });
        }
        if (tab === "delete") {
          clearShopPick({
            hiddenId: "collabDeleteSiteId",
            pickedId: "collabDeleteSitePicked",
            searchId: "collabDeleteSiteSearch",
            suggestionsId: "collabDeleteSiteSuggestions",
          });
          void fillDeletableCourses();
        }
      });
    });

    document.getElementById("collabConfirmAdd").addEventListener("click", async () => {
      const name = document.getElementById("collabAddName").value.trim();
      const address = document.getElementById("collabAddAddr").value.trim();
      const map_course = document.getElementById("collabAddCourse").value;
      if (!name || !address) {
        status.textContent = "名前と住所を入力してください";
        return;
      }
      await submitActions([{ type: "add_site", name, address, map_course }], status);
    });

    document.getElementById("collabConfirmDelete").addEventListener("click", async () => {
      const site_id = document.getElementById("collabDeleteSiteId").value;
      if (!site_id) {
        status.textContent = "候補から工務店を選んでください";
        return;
      }
      const sites = api.getMapData().sites || [];
      const site = sites.find((s) => s.id === site_id);
      const label = site?.name || site_id;
      if (!confirm(`「${label}」を地図から消去します。よろしいですか？`)) return;
      await submitActions([{ type: "delete_site", site_id }], status);
    });

    document.getElementById("collabConfirmMove").addEventListener("click", async () => {
      const site_id = document.getElementById("collabMoveSiteId").value;
      const map_course = document.getElementById("collabMoveCourse").value;
      if (!site_id || !map_course) {
        status.textContent = "候補から工務店とコースを選んでください";
        return;
      }
      await submitActions([{ type: "move_course", site_id, map_course }], status);
    });

    document.getElementById("collabConfirmDeleteCourse").addEventListener("click", async () => {
      const course_name = document.getElementById("collabDeleteCourse")?.value?.trim();
      if (!course_name) {
        status.textContent = "削除するコースを選んでください";
        return;
      }
      if (!confirm(`コース「${course_name}」を削除します。よろしいですか？`)) return;
      await submitActions([{ type: "delete_course", course_name }], status);
    });

    document.getElementById("collabConfirmCreate").addEventListener("click", async () => {
      const course_name = document.getElementById("collabCourseName").value.trim();
      const hub = document.getElementById("collabCourseHubId").value || selectedHubId;
      if (!course_name || selectedSiteIds.size === 0) {
        status.textContent = "コース名と工務店（1件以上）を選んでください";
        return;
      }
      if (!hub) {
        status.textContent = "地図の倉庫（赤丸）をタップして出発倉庫を選んでください";
        return;
      }
      await submitActions(
        [
          {
            type: "create_course",
            course_name,
            site_ids: [...selectedSiteIds],
            hub,
          },
        ],
        status
      );
    });
  }

  function renderSelectedList() {
    const ul = document.getElementById("collabSelectedList");
    if (!ul) return;
    const sites = api.getMapData().sites || [];
    ul.innerHTML = [...selectedSiteIds]
      .map((id) => {
        const s = sites.find((x) => x.id === id);
        return `<li>${s?.name || id} <button type="button" data-rm="${id}">×</button></li>`;
      })
      .join("");
    ul.querySelectorAll("[data-rm]").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedSiteIds.delete(btn.dataset.rm);
        renderSelectedList();
        updateCreatePreview();
      });
    });
    refreshCreateStats();
    updateCreatePreview();
  }

  function setStatus(msg) {
    const st = document.getElementById("collabStatus");
    if (st) st.textContent = msg;
    if (api?.showHint) api.showHint(msg);
  }

  function bindWarehouseClickForCreate(panel) {
    if (!api.getWarehouseMarkers) return;
    api.getWarehouseMarkers().forEach(({ marker, id, warehouse }) => {
      if (!marker || !warehouse) return;
      marker.on("click", () => {
        if (panel.hidden) return;
        const createTab = panel.querySelector('[data-panel="create"]');
        if (createTab?.hidden) return;
        pickCreateHub(id, warehouse.name || id);
      });
    });
  }

  function ensureEditKeyGate() {
    const fab = document.createElement("button");
    fab.type = "button";
    fab.className = "collab-fab";
    fab.textContent = "編集";
    fab.title = "工務店追加・コース変更";
    document.body.appendChild(fab);

    fab.addEventListener("click", () => {
      if (!editKey()) {
        const k = prompt("編集用合言葉を入力（地図と同じ合言葉）");
        if (!k) return;
        setEditKey(k);
      }
      const panel = document.querySelector(".collab-editor");
      if (panel) panel.hidden = !panel.hidden;
    });
  }

  window.__chibaMapCollabInit = function (mapApi) {
    api = mapApi;
    const panel = buildPanel();
    bindPanel(panel);
    bindWarehouseClickForCreate(panel);
    ensureEditKeyGate();
  };
})();

  </script>
</body>
</html>
