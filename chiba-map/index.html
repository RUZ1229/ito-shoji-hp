<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="chiba-map-build" content="2026-09-16T06:25:40">
  <meta name="chiba-map-live-base" content="https://ruz1229.github.io/ito-shoji-hp/chiba-map">
  <meta name="chiba-map-access-required" content="1">
  <meta name="chiba-map-access-keys" content="PK9aQfI-vc1efEizC-Sm2w,PK9aQfl-vc1efEizC-Sm2w">
  <meta name="chiba-map-collab-api" content="https://ito-shoji-map-collab.rirui1903.workers.dev">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伊藤商事 千葉配送地図</title>
  <link rel="stylesheet" href="vendor/leaflet.css?v=20260916T06254">
  <link rel="stylesheet" href="css/chiba-map.css?v=20260916T06254">
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <h1>伊藤商事 千葉配送地図</h1>
      <p class="header__sub">工務店・倉庫・コースルート（共有用）</p>
    </div>
    <div class="search-panel">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="工務店名・コースを追加（複数可）…" autocomplete="off" aria-autocomplete="list" aria-controls="searchSuggestions">
        <ul id="searchSuggestions" class="search-suggestions" role="listbox" hidden></ul>
      </div>
      <button id="searchBtn" type="button">追加</button>
      <button id="printBtn" type="button" class="btn-ghost" title="今の地図画面を印刷">印刷</button>
      <button id="resetBtn" type="button" class="btn-ghost">リセット</button>
    </div>
    <div id="searchTags" class="search-tags" hidden></div>
    <div id="searchHint" class="search-hint"></div>
  </header>

  <aside class="legend" id="legend"></aside>

  <div id="mapPrintBanner" class="map-print-banner" hidden>
    <h2 id="mapPrintTitle" class="map-print-banner__title"></h2>
    <p id="mapPrintSubtitle" class="map-print-banner__sub"></p>
  </div>

  <div id="map"></div>

  <footer class="footer">
    <span id="statusText">読込中…</span>
    <span id="visitPeriodText" class="footer__period"></span>
  </footer>

  <script src="vendor/leaflet.js?v=20260916T06254"></script>
  <script src="vendor/leaflet-ant-path.min.js?v=20260916T06254"></script>
  <script src="js/chiba-map.js?v=20260916T06254"></script>
  <script src="js/map-collab-editor.js?v=20260916T062540"></script>
  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        var st = document.getElementById("statusText");
        if (!st) return;
        if (st.textContent.indexOf("読込中") === -1) return;
        if (typeof L === "undefined") {
          st.textContent = "地図ライブラリが読めません。Ctrl+F5 で再読込してください。";
          return;
        }
        if (!window.__chibaMapBooted) {
          st.textContent = "地図プログラムが起動できません。Ctrl+F5 で再読込してください。";
        }
      }, 15000);
    });
  </script>
</body>
</html>
