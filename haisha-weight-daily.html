  const monthEl = document.getElementById("month");
  const shipEl = document.getElementById("ship");
  const qEl = document.getElementById("q");
  const suggestEl = document.getElementById("suggest");
  const meta = document.getElementById("meta");
  const thead = document.getElementById("thead");
  const tbody = document.querySelector("#tbl tbody");
  let picked = null;
  let searchMonth = null;

  function monthKey(shipIso) {
    return (shipIso || "").slice(0, 7);
  }

  function formatMonthLabel(mk) {
    if (!mk || mk.length < 7) return mk || "";
    return mk.slice(0, 4) + "年" + parseInt(mk.slice(5, 7), 10) + "月";
  }

  function allMonthKeys() {
    const set = new Set(Object.keys(DATA).map((d) => d.slice(0, 7)));
    return [...set].sort().reverse();
  }

  function datesInMonth(mk) {
    return Object.keys(DATA)
      .filter((d) => d.startsWith(mk))
      .sort()
      .reverse();
  }

  function syncShipOptions(preferred) {
    const mk = monthEl.value;
    const dates = datesInMonth(mk);
    shipEl.innerHTML = dates
      .map((d) => `<option value="${d}">${d}</option>`)
      .join("");
    if (preferred && dates.includes(preferred)) shipEl.value = preferred;
    else if (dates.length) shipEl.value = dates[0];
  }

  function addrKey(addr) {
    return (addr || "").replace(/[\s　]/g, "");
  }

  function shopsInMonth(mk) {
    const map = new Map();
    Object.keys(DATA)
      .filter(d => d.startsWith(mk))
      .forEach(d => {
        (DATA[d] || []).forEach(r => {
          const k = addrKey(r.addr);
          if (!k) return;
          let e = map.get(k);
          if (!e) {
            e = { addr: r.addr, names: new Set(), courses: new Set() };
            map.set(k, e);
          }
          e.names.add(r.name);
          e.courses.add(r.course);
        });
      });
    return [...map.entries()]
      .map(([k, e]) => {
        const names = [...e.names];
        const primary =
          names.slice().sort((a, b) => b.length - a.length)[0] ||
          names.sort((a, b) => a.localeCompare(b, "ja"))[0] ||
          "";
        const courseNorm = s =>
          String(s || "")
            .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch =>
              String.fromCharCode(ch.charCodeAt(0) - 0xfee0)
            )
            .replace(/\s/g, "");
        const courses = [...new Set([...e.courses].map(courseNorm))].filter(Boolean);
        courses.sort((a, b) => a.localeCompare(b, "ja"));
        const course = courses[0] || "";
        return {
          addrKey: k,
          addr: e.addr,
          name: primary,
          label: primary,
          course,
        };
      })
      .sort((a, b) => a.name.localeCompare(b.name, "ja"));
  }

  function candidateMatch(c, q) {
    const hay = (c.name + c.addr + c.course).toLowerCase();
    return hay.includes(q);
  }

  function catalogHits(q, mk) {
    return shopsInMonth(mk).filter(c => candidateMatch(c, q));
  }

  function resolveAddrKeys() {
    if (picked) return new Set([picked.addrKey]);
    const q = (qEl.value || "").trim().toLowerCase();
    if (!q || !searchMonth) return null;
    const keys = catalogHits(q, searchMonth).map(c => c.addrKey);
    return keys.length ? new Set(keys) : null;
  }

  function tryAutoPick() {
    if (picked) return;
    const q = (qEl.value || "").trim().toLowerCase();
    if (!q || !searchMonth) return;
    const hits = catalogHits(q, searchMonth);
    if (hits.length === 1) {
      const c = hits[0];
      picked = { addrKey: c.addrKey, label: c.name, addr: c.addr };
    }
  }

  function rowMatch(r) {
    const keys = resolveAddrKeys();
    if (keys) return keys.has(addrKey(r.addr));
    const q = (qEl.value || "").trim().toLowerCase();
    if (!q) return false;
    return (r.name + r.addr + r.course).toLowerCase().includes(q);
  }

  function updateSuggest() {
    const mk = searchMonth || monthEl.value;
    const q = (qEl.value || "").trim().toLowerCase();
    suggestEl.innerHTML = "";
    if (!q || picked) return;
    const hits = shopsInMonth(mk).filter(c => candidateMatch(c, q)).slice(0, 15);
    hits.forEach(c => {
      const li = document.createElement("li");
      li.innerHTML =
        `<span class="c-name">${esc(c.name)}</span>（${esc(c.course)}）` +
        `<div class="c-sub">${esc(c.addr)}</div>`;
      li.addEventListener("mousedown", e => {
        e.preventDefault();
        searchMonth = monthEl.value;
        picked = { addrKey: c.addrKey, label: c.name, addr: c.addr };
        qEl.value = c.name;
        suggestEl.innerHTML = "";
        render();
      });
      suggestEl.appendChild(li);
    });
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/"/g, "&quot;");
  }

  function render() {
    const k = shipEl.value;
    const q = (qEl.value || "").trim().toLowerCase();
    const searching = picked || q;

    if (searching) {
      if (!searchMonth) searchMonth = monthKey(k);
      tryAutoPick();
      const mk = searchMonth;
      const cap = monthKey(k) === mk ? k : mk + "-99";
      thead.innerHTML =
        "<tr><th>出荷日</th><th>工務店</th><th>コース</th><th>kg</th><th>住所</th></tr>";
      const out = [];
      Object.keys(DATA)
        .filter(d => d.startsWith(mk) && d <= cap)
        .sort()
        .forEach(d => {
          (DATA[d] || []).forEach(r => {
            if (rowMatch(r)) out.push({ ...r, ship: d });
          });
        });
      out.sort((a, b) => (a.ship < b.ship ? 1 : a.ship > b.ship ? -1 : 0));
      const total = out.reduce((a, r) => a + r.kg, 0);
      const days = new Set(out.map(r => r.ship)).size;
      const who = picked ? picked.label : `「${q}」`;
      const capLabel = monthKey(k) === mk ? k : mk + " 全期間";
      meta.textContent =
        `${mk} 出荷 ${capLabel} まで … ${who} ${out.length} 行（${days} 出荷日）/ 合計 ${total.toLocaleString()} kg`;
      tbody.innerHTML = out
        .map(
          r =>
            `<tr><td>${r.ship}</td><td>${r.name}</td><td>${r.course}</td>` +
            `<td>${r.kg.toLocaleString()}</td><td>${r.addr}</td></tr>`
        )
        .join("");
      return;
    }

    thead.innerHTML = "<tr><th>工務店</th><th>コース</th><th>kg</th><th>住所</th></tr>";
    const rows = DATA[k] || [];
    const total = rows.reduce((a, r) => a + r.kg, 0);
    meta.textContent = `出荷 ${k} … ${rows.length} 件 / 合計 ${total.toLocaleString()} kg`;
    tbody.innerHTML = rows
      .map(
        r =>
          `<tr><td>${r.name}</td><td>${r.course}</td>` +
          `<td>${r.kg.toLocaleString()}</td><td>${r.addr}</td></tr>`
      )
      .join("");
  }

  qEl.addEventListener("input", () => {
    const qv = (qEl.value || "").trim();
    if (!qv) {
      picked = null;
      searchMonth = null;
    } else {
      picked = null;
      if (!searchMonth) searchMonth = monthEl.value;
    }
    updateSuggest();
    render();
  });
  qEl.addEventListener("focus", updateSuggest);
  qEl.addEventListener("blur", () => setTimeout(() => { suggestEl.innerHTML = ""; }, 150));
  monthEl.addEventListener("change", () => {
    syncShipOptions(null);
    if (picked || (qEl.value || "").trim()) searchMonth = monthEl.value;
    updateSuggest();
    render();
  });
  shipEl.addEventListener("change", () => {
    if ((picked || (qEl.value || "").trim()) && monthEl.value !== searchMonth) {
      searchMonth = monthEl.value;
    }
    updateSuggest();
    render();
  });

  monthEl.innerHTML = allMonthKeys()
    .map((mk) => `<option value="${mk}">${formatMonthLabel(mk)}</option>`)
    .join("");
  syncShipOptions(null);
  render();
  </script>
</body>
</html>
