    <circle cx="760" cy="300" r="4"/>
    <circle cx="980" cy="340" r="3.5"/>
    <circle cx="1120" cy="380" r="4"/>
    <circle cx="420" cy="560" r="3"/>
    <circle cx="900" cy="580" r="3.5"/>
  </g>
  <rect width="1600" height="900" fill="url(#fade)"/>
